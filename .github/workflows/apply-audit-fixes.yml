name: Apply White Lotus audit patches

on:
  push:
    branches: [audit-fixes-v11.0.20-22]
    paths: [.github/workflows/apply-audit-fixes.yml]

permissions:
  contents: write

concurrency:
  group: white-lotus-audit-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/audit-fixes-v11.0.20-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-fixes-v11.0.20-22
          fetch-depth: 0

      - name: Verify patch inputs and apply sequentially
        shell: bash
        run: |
          set -euo pipefail
          html='Белый_Лотос_Halloween_Reel_v11.0.19.html'
          checklist='Белый_Лотос_Halloween_чек-лист_доработок_Reel_v2.md'
          test "$(git hash-object "$html")" = '3b1e07c47193762e82c02ba7a2a855049dec03f7'
          test "$(git hash-object "$checklist")" = '8f301c4d841fde407f5b3e383f758455dc46a3d1'
          test "$(cat fixes/expected-blob.txt)" = 'e9f541d1bfdf476aebe8302b79932de2b3353088'
          for i in 1 2 3 4 5 6 7; do
            test -s "fixes/fix-$i.patch"
            test -s "fixes/msg-$i.txt"
          done
          git config user.name 'White Lotus audit bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5 6 7; do
            git apply --check --unidiff-zero "fixes/fix-$i.patch"
            git apply --unidiff-zero "fixes/fix-$i.patch"
            git add -A
            git commit -q -F "fixes/msg-$i.txt"
            echo "Applied patch $i"
          done
          got="$(git hash-object "$html")"
          want="$(cat fixes/expected-blob.txt)"
          test "$got" = "$want" || { echo "HTML SHA mismatch: $got vs $want"; exit 1; }
          echo "Verified HTML blob: $got"

      - name: Clean build helpers and push audit branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -q fixes
          git rm -q .github/workflows/apply-audit-fixes.yml
          git commit -q -m 'chore: remove one-shot audit patch helpers'
          if ! git push origin HEAD:refs/heads/audit-fixes-v11.0.20-22; then
            echo "Retrying without deleting the workflow (token may lack workflow scope)"
            git reset --soft HEAD~1
            git restore --source=HEAD --staged --worktree .github/workflows/apply-audit-fixes.yml
            git commit -q -m 'chore: remove audit patch inputs'
            git push origin HEAD:refs/heads/audit-fixes-v11.0.20-22
          fi
